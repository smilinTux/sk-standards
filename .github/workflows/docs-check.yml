name: docs-check

# The DOCS_FRESHNESS_STANDARD gate, as a REUSABLE workflow.
#
# Repos call it rather than copy it:
#
#   jobs:
#     docs:
#       uses: smilinTux/sk-standards/.github/workflows/docs-check.yml@5739f753f1a7cb5196b6d5f257453660f3516dfc
#
# One canonical source. Thirty copies drift, which is the exact trap the standard
# exists to close.
#
# Tiers (see standards/DOCS_FRESHNESS_STANDARD.md):
#   1 presence  - the 7 required docs exist
#   2 changelog - a PR touching src/** or pyproject.toml also touches CHANGELOG.md
#   3 evidence  - every check in SOP.md's docs-evidence block still exits 0
#
# Tier 3 is the one that matters. Tiers 1 and 2 catch a MISSING doc; tier 3 catches
# a doc that is present, confident, and wrong, which is the case that hurts because
# it is trusted.

on:
  workflow_call:
    inputs:
      tiers:
        description: "Comma-separated tiers to enforce, e.g. '1,2' while adopting."
        type: string
        default: "1,2,3"
      standards-ref:
        description: "Ref of sk-standards to take the validator from."
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the changed-file diff against the base ref works.
          fetch-depth: 0

      - name: Fetch the validator from sk-standards
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: smilinTux/sk-standards
          ref: ${{ inputs.standards-ref }}
          path: .sk-standards
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect changed files (pull requests and merge queue)
        id: changed
        # Without this also covering merge_group, tier 2 silently no-ops for
        # every merge-queue run: `github.base_ref` is only populated for
        # pull_request, so this step used to be skipped entirely under
        # merge_group, /tmp/changed.txt was never written, and the "Run
        # docs-check" step below falls through to calling docs_check.py with
        # no --changed-files at all - which tier2_changelog treats as "not a
        # PR, skip" and passes unconditionally, regardless of what changed.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            # merge_group carries no pull_request context (github.base_ref is
            # empty here); the event itself names the base ref being tested.
            base_ref="${{ github.event.merge_group.base_ref }}"
          else
            base_ref="${{ github.base_ref }}"
          fi
          base_ref="${base_ref#refs/heads/}"
          git fetch --no-tags origin "$base_ref" --depth=50 || true
          git diff --name-only "origin/$base_ref...HEAD" > /tmp/changed.txt || true
          echo "count=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"
          cat /tmp/changed.txt

      - name: Honour the changelog escape hatch
        id: hatch
        # Deliberately NOT extended to merge_group: that event carries no
        # pull_request context (no title, no labels), so there is nothing
        # here to read the docs-exempt label or [skip-changelog] title from.
        # Left as pull_request-only, this step simply does not run under
        # merge_group, `hatch.outputs.used` is then empty (not "yes"), and
        # the "Run docs-check" step below treats that the same as "not
        # waived" - i.e. this fails CLOSED under merge_group rather than
        # silently re-granting an exemption. Net effect: a PR that used the
        # escape hatch during review is NOT exempt again at merge-queue time
        # and must actually satisfy tier 2 there. Known, intentional
        # limitation - revisit only if that turns out to block real PRs.
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          used=no
          case "$TITLE" in *"[skip-changelog]"*) used=yes ;; esac
          case ",$LABELS," in *",docs-exempt,"*) used=yes ;; esac
          echo "used=$used" >> "$GITHUB_OUTPUT"
          # Log it. An unlogged escape hatch becomes the default path within a
          # quarter, and then the gate is decorative.
          if [ "$used" = "yes" ]; then
            echo "::warning title=changelog check waived::PR '$TITLE' waived the CHANGELOG requirement (labels: $LABELS)"
          fi

      - name: Run docs-check
        run: |
          set -euo pipefail
          ARGS=""
          for t in $(echo "${{ inputs.tiers }}" | tr ',' ' '); do ARGS="$ARGS --tier $t"; done
          if [ -f /tmp/changed.txt ] && [ "${{ steps.hatch.outputs.used }}" != "yes" ]; then
            ARGS="$ARGS --changed-files /tmp/changed.txt"
          fi
          python .sk-standards/scripts/docs_check.py --repo . $ARGS

      - name: Prove the gate can fail (negative control)
        # A gate that passes everything is worth no more than one that never ran.
        # Cheap, hermetic, and it runs every time so the checker cannot silently
        # rot into a no-op.
        run: python .sk-standards/scripts/docs_check.py --self-test
