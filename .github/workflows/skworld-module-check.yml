name: SKWorld module contract

on:
  pull_request:
    paths:
      - "reference/skworld-module/**"
      - "standards/SKWORLD_MODULE_CONTRACT_STANDARD.md"
      - "scripts/check_skworld_module.py"
      - ".github/workflows/skworld-module-check.yml"
  push:
    branches: [main]
    paths:
      - "reference/skworld-module/**"
      - "standards/SKWORLD_MODULE_CONTRACT_STANDARD.md"
      - "scripts/check_skworld_module.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'jsonschema==4.25.1'
      - run: python scripts/check_skworld_module.py
