name: SKWorld module contract

on:
  pull_request:
    paths:
      - "reference/skworld-module/**"
      - "standards/SKWORLD_MODULE_CONTRACT_STANDARD.md"
      - "scripts/check_skworld_module.py"
      - ".github/workflows/skworld-module-check.yml"
  push:
    branches: [main]
    paths:
      - "reference/skworld-module/**"
      - "standards/SKWORLD_MODULE_CONTRACT_STANDARD.md"
      - "scripts/check_skworld_module.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'jsonschema==4.25.1'
      - run: python scripts/check_skworld_module.py
