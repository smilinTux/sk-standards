# Tier A: backoff only. For infra that must NEVER permanently die
# (container runtimes, inference/embedding servers, node daemons).
#
# Retries forever so a transient fault self-heals unattended, but backs off from
# RestartSec up to 5min, capping a permanent-fault storm at ~12 attempts/hour
# instead of 8,640/day. Adds no new way for the service to stay down.
#
# See standards/SERVICE_UNIT_STANDARD.md. Requires systemd 254+.
[Service]
RestartSteps=8
RestartMaxDelaySec=5min
