# Tier B: backoff + limiter. For leaf apps and optional services.
#
# Same backoff as Tier A, plus a StartLimitIntervalSec wide enough that the
# limiter can actually engage, so a genuinely permanent fault (typically
# status=203/EXEC after a moved venv) lands in `failed` where monitoring sees it
# instead of retrying silently forever.
#
# The rule: RestartSec x (StartLimitBurst - 1) MUST be < StartLimitIntervalSec.
# Defaults (Burst=5, Interval=10s) silently disable the limiter for any
# RestartSec >= 2.5s.
#
# See standards/SERVICE_UNIT_STANDARD.md. Requires systemd 254+.
[Service]
RestartSteps=8
RestartMaxDelaySec=5min

[Unit]
StartLimitIntervalSec=30min
StartLimitBurst=5
